schema_version: 1
workflow_id: strategy-research-pipeline
fixed_timestamp: "2026-08-28T23:00:00+00:00"

inputs:
  ohlcv: replay-inputs/ohlcv.parquet
  backtest_metrics: replay-inputs/backtest_metrics.json

steps:
  - step: 1
    executor: strategy_research_detect_initial
    executor_mode: native_cli
    gate_policy: continue
    output_files:
      initial_market_summary:
        canonical: 01_initial_market_summary.json
      initial_anomalies:
        canonical: 01_initial_anomalies.json
      initial_tickets:
        canonical: 01_initial_tickets.json
  - step: 2
    executor: strategy_research_hints
    executor_mode: native_cli
    gate_policy: continue
    output_files:
      edge_hints:
        canonical: 02_edge_hints.yaml
  - step: 3
    executor: strategy_research_detect_final
    executor_mode: native_cli
    gate_policy: record_only
    output_files:
      final_research_tickets:
        canonical: 03_final_research_tickets.json
  - step: 4
    executor: strategy_research_hold
    executor_mode: manual_contract
    gate_policy: record_only
    output_files:
      backtest_quality_assessment:
        canonical: 04_backtest_quality_assessment.json

variants:
  required-only:
    enabled_steps: [1, 2, 3, 4]
    golden_dir: replay-run
  full-path:
    enabled_steps: [1, 2, 3, 4]
    golden_dir: replay-run-full-path
