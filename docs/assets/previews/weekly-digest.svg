<svg xmlns="http://www.w3.org/2000/svg" width="640" height="472" viewBox="0 0 640 472" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Weekly Performance Digest</title>
  <desc id="desc">Four fictional closed trades with two wins, two losses, 50 percent win rate, 75 dollars realized profit, 18.75 dollars expectancy per trade, and a 2.0 profit factor.</desc>
  <rect width="640" height="472" fill="#f3f7fa"/>
  <rect x="20" y="20" width="600" height="432" rx="18" fill="#ffffff" stroke="#d8e3eb" stroke-width="2"/>
  <rect x="20" y="20" width="600" height="54" rx="18" fill="#123047"/>
  <rect x="20" y="54" width="600" height="20" fill="#123047"/>
  <text x="42" y="55" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Weekly Performance Digest</text>
  <rect x="40" y="94" width="560" height="35" rx="7" fill="#fff0cb"/>
  <text x="54" y="118" fill="#5a4100" font-family="Arial, sans-serif" font-size="18" font-weight="700">ILLUSTRATIVE / FICTIONAL DATA</text>
  <text x="42" y="161" fill="#53687a" font-family="Arial, sans-serif" font-size="18">EXECUTIVE SUMMARY · CLOSED TRADES ONLY</text>
  <text x="42" y="195" fill="#123047" font-family="Arial, sans-serif" font-size="22">4 trades · 2 wins · 2 losses</text>
  <line x1="42" y1="217" x2="598" y2="217" stroke="#d8e3eb" stroke-width="2"/>
  <text x="42" y="258" fill="#53687a" font-family="Arial, sans-serif" font-size="18">WIN RATE</text>
  <text x="42" y="292" fill="#123047" font-family="Arial, sans-serif" font-size="30" font-weight="700">50%</text>
  <text x="238" y="258" fill="#53687a" font-family="Arial, sans-serif" font-size="18">REALIZED P&amp;L</text>
  <text x="238" y="292" fill="#12616a" font-family="Arial, sans-serif" font-size="30" font-weight="700">+$75</text>
  <text x="434" y="258" fill="#53687a" font-family="Arial, sans-serif" font-size="18">PROFIT FACTOR</text>
  <text x="434" y="292" fill="#123047" font-family="Arial, sans-serif" font-size="30" font-weight="700">2.00</text>
  <text x="42" y="337" fill="#123047" font-family="Arial, sans-serif" font-size="19">Expectancy: +$18.75 per closed trade</text>
  <text x="42" y="368" fill="#53687a" font-family="Arial, sans-serif" font-size="18">Fictional P&amp;L: +$100, -$50, +$50, -$25</text>
  <line x1="42" y1="390" x2="598" y2="390" stroke="#d8e3eb" stroke-width="2"/>
  <text x="42" y="424" fill="#53687a" font-family="Arial, sans-serif" font-size="17">Lessons learned: review exit notes before changing rules.</text>
</svg>
